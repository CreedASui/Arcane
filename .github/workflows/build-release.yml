name: Build and release Arcane UI

on:
  pull_request:
    branches: [main]
    paths:
      - "Arcane/**"
      - "tools/**"
      - ".github/workflows/build-release.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Arcane/**"
      - "tools/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Validate and package Arcane
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packaging dependency
        run: python -m pip install --upgrade pip fonttools

      - name: Validate and build installable ZIP
        run: python tools/package.py

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Arcane-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/Arcane-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Arcane-*.zip
