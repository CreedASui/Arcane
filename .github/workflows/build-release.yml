name: Build and release Arcane UI

on:
  pull_request:
    branches: [main]
    paths:
      - "Arcane/**"
      - "tools/**"
      - "dev/arcane/**"
      - ".github/workflows/build-release.yml"
  push:
    branches: [main, "feature/arcane-loot-popup-1.19.0"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Test, validate, and package Arcane
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          python -m pip install --upgrade pip fonttools

      - name: Check Lua syntax
        run: |
          find Arcane -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p dev/arcane/tiny_plates_tests.lua
          luac5.1 -p dev/arcane/mock_arcane.lua
          luac5.1 -p dev/arcane/loot_tests.lua
          luac5.1 -p dev/arcane/tests.lua

      - name: Run Arcane regression tests
        working-directory: dev
        run: lua5.1 arcane/tiny_plates_tests.lua . ../Arcane

      - name: Run focused Arcane loot tests
        working-directory: dev
        run: lua5.1 arcane/loot_tests.lua . ../Arcane

      - name: Check translations
        run: python dev/arcane/locale_check.py Arcane

      - name: Validate and build installable ZIP
        run: python tools/package.py

      - name: Upload build artifact
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Arcane-${{ github.run_number }}-test
          path: dist/Arcane-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Arcane-*.zip
