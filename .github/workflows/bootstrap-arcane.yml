name: Bootstrap Arcane from working base

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-arcane.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Arcane
        uses: actions/checkout@v4

      - name: Check out the tested working base
        uses: actions/checkout@v4
        with:
          repository: JamieeLee/CreedUI-for-AS-
          ref: arcane-seed-export
          path: .source
          persist-credentials: false

      - name: Rebrand the project as Arcane
        run: python3 .github/scripts/rebrand_arcane.py .source .

      - name: Commit the independent Arcane project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The GitHub App token cannot create workflow files unless it has
          # the special "workflows" scope. Keep the repo-owned workflow files
          # untouched in this bootstrap commit; install the Arcane ZIP workflow
          # separately through a normal GitHub UI commit.
          rm -rf .github/workflows/package-arcane-zip.yml
          git add -A
          git commit -m "Rebrand working UI foundation as Arcane"
          git push origin HEAD:main
